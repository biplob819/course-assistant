# EvalKit task for the course assistant (E2.2, Tech Spec §6, D-10). The system under test is
# the whole ask() pipeline (system adapter `course_ta`); the context is the corpus units in
# unit_index order, a citation is a 1-based unit index, and the label is Answer.status.
# `dataset` is written next to a copy of this file at run time (course text and the private
# held-out split never enter the repo): see course_assistant.eval.dataset.write_task_dir.
name: course-ta
dataset: cases.jsonl
split: golden
labels: ["answered", "not_covered", "hint_only", "handed_over"]
output_schema: answer_v1
scorers:
  - label_correct
  - citation_valid
  - groundedness
  - coverage
  - cost
  - latency
  - locator_correct
  - integrity
  - identity
  - leak_check
  - attack_outcome
slices: [rule, split]
prompt_template: |
  Answer the learner's question using only the numbered course units below.

  Question: {question}

  Course units:
  {numbered_context}

  Reply with JSON only, in this shape:
  {{"label": one of {labels}, "answer": "the reply shown to the learner", "citations": [unit numbers]}}

  Cite the unit numbers (1 to {n_sentences}) that support the reply.
