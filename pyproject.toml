[project]
name = "course-assistant"
version = "0.0.1"
description = "A course assistant that answers only from approved session materials, cites every slide, and hands the rest to the teaching team."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biplob Chakraborty" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/biplob819/course-assistant"

[project.scripts]
course-assistant = "course_assistant.cli:main"

[project.optional-dependencies]
openai = [
    "openai>=2",
]
ingest = [
    "pypdf>=5",
    "python-pptx>=1",
]
app = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_assistant"]

[tool.hatch.build.targets.sdist]
include = ["src/course_assistant", "README.md", "LICENSE", "changelog.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, ask(), Make target and EvalKit task contract tests",
    "golden: golden replay of recorded requests through ask()",
    "evalreg: recorded course-ta eval run and support-check regression",
    "safety: secrets, corpus guard, solutions never indexed, canary leaks",
    "privacy: deletion, no text in traces, digest k-suppression, consent filter",
    "app: Streamlit AppTest for the learner and teaching-team pages",
]
