# Example: run the course-ta release gate on your own course (R3.1 OSS-07).
#
# This is an example, not an active workflow. To use it in your fork, copy it to
# .github/workflows/course-ta-gate.yml and change COURSE_CONFIG and the paths below.
#
# - The offline job needs no secret and runs on every pull request.
# - The live job runs the held-out golden set and the gate. It runs only on main (a push or
#   a manual run), never on a pull request, so code from a pull request never reaches your
#   keys or your held-out cases. Its secrets come from a protected `release` environment:
#   OPENAI_API_KEY and HELDOUT_BUNDLE (your golden/heldout/ folder as a base64 tar.gz).
#   Without them every live step is skipped.
# - The gate script is called directly, so its exit code fails the job: 1 when a threshold
#   fails, 2 on an error, 3 at the cost cap, 4 when judging is pending. (make would turn every
#   failure into 2.)
# - Every action is pinned to a commit SHA, and checkout keeps no credentials.
name: course-ta-gate

on:
  pull_request:
    paths:
      - "my-course/**"
      - "golden/**"
  push:
    branches: [main]
    paths:
      - "my-course/**"
      - "golden/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  COURSE_CONFIG: my-course/config.yaml

jobs:
  offline:
    name: release gate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # the tuning log is checked append-only against history
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      # needs your materials in the checkout (a private fork); drop this step if they are not
      - name: show the ingest plan (no API call)
        run: uv run course-assistant ingest --config "$COURSE_CONFIG" --dry-run
      - name: check the golden cases and the split
        run: uv run python scripts/golden_tool.py check
      - name: offline release gate
        run: uv run python scripts/release_gate.py offline --json

  live:
    name: release gate (live, held-out)
    needs: offline
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: release
    runs-on: ubuntu-latest
    steps:
      - id: secrets
        name: check for the live secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HELDOUT_BUNDLE: ${{ secrets.HELDOUT_BUNDLE }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] && [ -n "$HELDOUT_BUNDLE" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::live gate skipped: OPENAI_API_KEY or HELDOUT_BUNDLE is not set"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.secrets.outputs.live == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        if: steps.secrets.outputs.live == 'true'
        with:
          python-version: "3.13"
      - if: steps.secrets.outputs.live == 'true'
        run: uv sync --locked --all-extras
      - name: restore the private held-out folder
        if: steps.secrets.outputs.live == 'true'
        run: echo "$HELDOUT_BUNDLE" | base64 -d | tar -xz -C golden/heldout
        env:
          HELDOUT_BUNDLE: ${{ secrets.HELDOUT_BUNDLE }}
      - name: ingest the course
        if: steps.secrets.outputs.live == 'true'
        run: uv run course-assistant ingest --config "$COURSE_CONFIG"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: held-out run and release gate (fails the job on a failed threshold)
        if: steps.secrets.outputs.live == 'true'
        run: uv run python scripts/release_gate.py eval --config "$COURSE_CONFIG" --yes --no-flip --out runs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always() && steps.secrets.outputs.live == 'true'
        with:
          name: release-gate-live
          # the verdict only: the run folder itself holds model answers
          path: runs/gate.json
          if-no-files-found: warn
