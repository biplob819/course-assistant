<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">course-assistant: data flow of one learner question</title>
  <desc id="d">A learner question passes the passcode gate, then route and answer run in parallel; the answer is grounded, integrity-checked and leak-scanned before a status is chosen. Not-covered answers can go to the teaching team's queue. Consenting learners' questions feed a k-anonymous weekly digest.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.5}
      .model{fill:#eef2ff;stroke:#4338ca;stroke-width:1.5}
      .check{fill:#ecfdf5;stroke:#047857;stroke-width:1.5}
      .store{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}
      .staff{fill:#fdf4ff;stroke:#a21caf;stroke-width:1.5}
      .h{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .lbl{font-size:12px;fill:#475569;font-style:italic}
      .ln{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#64748b;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">course-assistant: how one learner question flows</text>

  <!-- learner and gate -->
  <rect class="box" x="40" y="70" width="190" height="60" rx="8"/>
  <text class="h" x="135" y="96" text-anchor="middle">Learner</text>
  <text class="s" x="135" y="116" text-anchor="middle">asks in the chat page</text>

  <rect class="box" x="290" y="70" width="230" height="60" rx="8"/>
  <text class="h" x="405" y="94" text-anchor="middle">Passcode gate</text>
  <text class="s" x="405" y="114" text-anchor="middle">salted hash, rate-limited, revocable</text>

  <rect class="box" x="580" y="70" width="230" height="60" rx="8"/>
  <text class="h" x="695" y="94" text-anchor="middle">Pause check + window</text>
  <text class="s" x="695" y="114" text-anchor="middle">last 6 turns, ≤ 3,000 tokens</text>

  <rect class="store" x="880" y="70" width="280" height="60" rx="8"/>
  <text class="h" x="1020" y="94" text-anchor="middle">Consent and notice</text>
  <text class="s" x="1020" y="114" text-anchor="middle">purposes chosen by the learner</text>

  <path class="ln" d="M230,100 H288"/>
  <path class="ln" d="M520,100 H578"/>
  <path class="dash" d="M880,100 H812"/>

  <!-- parallel route and answer -->
  <rect class="model" x="120" y="200" width="300" height="74" rx="8"/>
  <text class="h" x="270" y="226" text-anchor="middle">Route (Luna)</text>
  <text class="s" x="270" y="246" text-anchor="middle">course · graded work · admin · personal</text>
  <text class="s" x="270" y="263" text-anchor="middle">off topic · injection</text>

  <rect class="model" x="560" y="200" width="320" height="74" rx="8"/>
  <text class="h" x="720" y="226" text-anchor="middle">Answer (Sol + file search)</text>
  <text class="s" x="720" y="246" text-anchor="middle">only the session's course units</text>
  <text class="s" x="720" y="263" text-anchor="middle">cites unit, slide or page</text>

  <rect class="store" x="940" y="200" width="220" height="74" rx="8"/>
  <text class="h" x="1050" y="226" text-anchor="middle">Vector store</text>
  <text class="s" x="1050" y="246" text-anchor="middle">ingested course units</text>
  <text class="s" x="1050" y="263" text-anchor="middle">(sample course, CC BY 4.0)</text>

  <path class="ln" d="M695,130 V160 H270 V198"/>
  <path class="ln" d="M695,130 V198"/>
  <text class="lbl" x="470" y="155">in parallel</text>
  <path class="dash" d="M940,237 H882"/>

  <!-- checks -->
  <rect class="check" x="560" y="330" width="320" height="64" rx="8"/>
  <text class="h" x="720" y="356" text-anchor="middle">Ground: L1 rules + L2 support (Luna)</text>
  <text class="s" x="720" y="376" text-anchor="middle">citations resolve; every sentence supported</text>

  <rect class="check" x="560" y="420" width="320" height="64" rx="8"/>
  <text class="h" x="720" y="446" text-anchor="middle">Integrity check (Luna)</text>
  <text class="s" x="720" y="466" text-anchor="middle">never completes an assessment brief</text>

  <rect class="check" x="560" y="510" width="320" height="64" rx="8"/>
  <text class="h" x="720" y="536" text-anchor="middle">Leak scan (deterministic)</text>
  <text class="s" x="720" y="556" text-anchor="middle">no rules text, learner ids or canaries</text>

  <path class="ln" d="M720,274 V328"/>
  <path class="ln" d="M720,394 V418"/>
  <path class="ln" d="M720,484 V508"/>

  <!-- finalize -->
  <rect class="box" x="120" y="420" width="300" height="64" rx="8"/>
  <text class="h" x="270" y="446" text-anchor="middle">Finalize: pick one status</text>
  <text class="s" x="270" y="466" text-anchor="middle">from the route and the checks</text>
  <path class="ln" d="M270,274 V418"/>
  <path class="ln" d="M560,542 H460 V470 H422"/>

  <!-- statuses -->
  <rect class="box" x="40" y="620" width="170" height="64" rx="8"/>
  <text class="h" x="125" y="646" text-anchor="middle">answered</text>
  <text class="s" x="125" y="666" text-anchor="middle">source chips, AI label</text>

  <rect class="box" x="225" y="620" width="170" height="64" rx="8"/>
  <text class="h" x="310" y="646" text-anchor="middle">not covered</text>
  <text class="s" x="310" y="666" text-anchor="middle">"Ask the teaching team"</text>

  <rect class="box" x="410" y="620" width="170" height="64" rx="8"/>
  <text class="h" x="495" y="646" text-anchor="middle">hint only</text>
  <text class="s" x="495" y="666" text-anchor="middle">guidance, never a solution</text>

  <rect class="box" x="595" y="620" width="170" height="64" rx="8"/>
  <text class="h" x="680" y="646" text-anchor="middle">handed over</text>
  <text class="s" x="680" y="666" text-anchor="middle">admin or personal</text>

  <path class="ln" d="M270,484 V598 H125 V618"/>
  <path class="ln" d="M270,484 V598 H310 V618"/>
  <path class="ln" d="M270,484 V598 H495 V618"/>
  <path class="ln" d="M270,484 V598 H680 V618"/>

  <!-- staff -->
  <rect class="staff" x="860" y="620" width="300" height="64" rx="8"/>
  <text class="h" x="1010" y="646" text-anchor="middle">Escalation queue (no learner id)</text>
  <text class="s" x="1010" y="666" text-anchor="middle">staff passcode; every action audited</text>
  <path class="ln" d="M310,684 V720 H800 V652 H858"/>
  <path class="ln" d="M680,684 V720"/>
  <text class="lbl" x="420" y="740">question sent with the learner's choice</text>

  <rect class="staff" x="860" y="760" width="300" height="64" rx="8"/>
  <text class="h" x="1010" y="786" text-anchor="middle">Teaching team replies</text>
  <text class="s" x="1010" y="806" text-anchor="middle">learner sees "replies waiting"</text>
  <path class="ln" d="M1010,684 V758"/>
  <path class="dash" d="M860,792 H135 V686"/>

  <!-- store and digest -->
  <rect class="store" x="940" y="330" width="220" height="64" rx="8"/>
  <text class="h" x="1050" y="356" text-anchor="middle">Store (SQLite)</text>
  <text class="s" x="1050" y="376" text-anchor="middle">pseudonymous; delete on request</text>
  <rect class="store" x="940" y="420" width="220" height="90" rx="8"/>
  <text class="h" x="1050" y="446" text-anchor="middle">Weekly digest</text>
  <text class="s" x="1050" y="466" text-anchor="middle">consenting learners only</text>
  <text class="s" x="1050" y="483" text-anchor="middle">topic shown only if ≥ 5 learners</text>
  <text class="s" x="1050" y="500" text-anchor="middle">no question text, no ids</text>
  <path class="dash" d="M1050,394 V418"/>
  <path class="dash" d="M1050,510 V618"/>
  <path class="dash" d="M880,362 H938"/>
</svg>
