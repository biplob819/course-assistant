name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly; the release gate runs in eval-gate.yml (E2.4)

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # the tuning log must be append-only against this base (E2.3 CAL-02, D-55): the push's
      # previous head, or the pull request's base
      LOG_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      # a new branch's first push has an all-zero `before`: compare with its merge-base instead
      LOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # full history, so the base commit is there to compare with
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run python scripts/secret_scan.py
      - run: uv run python scripts/corpus_guard.py
      - run: uv run python scripts/verify_graph_eligibility.py
      - name: gate self-tests (every gate must be able to fail)
        run: |
          uv run python scripts/node_converge.py --self-test
          uv run python scripts/node_start.py --self-test
          uv run python scripts/verify_graph_eligibility.py --self-test
          uv run python scripts/secret_scan.py --self-test
          uv run python scripts/corpus_guard.py --self-test
      - run: uv build

  core-only:
    name: core install without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --no-dev  # the dev group carries the optional extras for tests
      - name: import the package and run the CLI without openai, pypdf, python-pptx or streamlit
        run: |
          uv run --no-dev python -c "import importlib.util as u; assert all(u.find_spec(m) is None for m in ('openai','pypdf','pptx','streamlit'))"
          uv run --no-dev course-assistant --version
