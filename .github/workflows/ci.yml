name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly hook; the golden-set eval job is added at E2.4

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: uv run python scripts/secret_scan.py
      - run: uv run python scripts/corpus_guard.py
      - run: uv run python scripts/verify_graph_eligibility.py
      - name: gate self-tests (every gate must be able to fail)
        run: |
          uv run python scripts/node_converge.py --self-test
          uv run python scripts/node_start.py --self-test
          uv run python scripts/verify_graph_eligibility.py --self-test
          uv run python scripts/secret_scan.py --self-test
          uv run python scripts/corpus_guard.py --self-test
      - run: uv build

  core-only:
    name: core install without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: import the package and run the CLI without openai, pypdf, python-pptx or streamlit
        run: |
          uv run python -c "import importlib.util as u; assert all(u.find_spec(m) is None for m in ('openai','pypdf','pptx','streamlit'))"
          uv run course-assistant --version
