name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who is it for (learner, teaching team, operator) and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Effect on the assistant's rules
      description: Does it touch grounding, citations, hints for graded work, hand-overs or privacy? How would a golden case test it?
